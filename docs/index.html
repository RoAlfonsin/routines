<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1115">
<title>The Hour · daily routines</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--line:#262b36;--txt:#eef1f6;--dim:#95a0b3;
        --work:#22c55e;--rest:#f59e0b;--prep:#3b82f6;--sun:#14b8a6;--med:#8b5cf6;--cool:#0ea5e9}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--txt);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #app{max-width:880px;margin:0 auto;padding:20px 18px 40px}
  h1{font-size:22px;margin:0 0 2px;font-weight:700}
  h2{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:26px 0 8px;font-weight:600}
  .sub{color:var(--dim);font-size:13px;margin-bottom:14px}
  .days{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .day{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 13px;cursor:pointer;text-align:left}
  .day:hover{border-color:#3d4657}
  .day.on{border-color:var(--work);background:#16241c}
  .day b{display:block;font-size:15px}
  .day span{display:block;color:var(--dim);font-size:12px;margin-top:3px;min-height:2.2em}
  .blocks{margin-top:6px}
  .blk{display:flex;justify-content:space-between;gap:12px;padding:10px 13px;background:var(--panel);
       border:1px solid var(--line);border-radius:12px;margin-bottom:7px;align-items:baseline}
  .blk b{font-weight:600;font-size:14px}
  .blk em{font-style:normal;color:var(--dim);font-size:12px;display:block;margin-top:2px}
  .blk u{text-decoration:none;color:var(--txt);font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
  .dot{display:inline-block;width:9px;height:9px;border-radius:99px;margin-right:8px;vertical-align:baseline}
  button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 14px;cursor:pointer}
  button:hover{border-color:#3d4657}
  .primary{background:var(--work);border-color:transparent;color:#04220f;font-weight:700}
  .row{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:17px}
  /* run */
  #run{display:none}
  #bar{display:flex;height:9px;border-radius:99px;overflow:hidden;background:var(--line);margin:16px 0 12px}
  #bar i{height:100%;transition:width .2s linear}
  .topline{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  #blockName{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
  #hourClock{font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px}
  #clock{font-size:clamp(58px,15vw,108px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;margin:10px 0 4px}
  #moveName{font-size:clamp(19px,4.4vw,28px);font-weight:700}
  #cue{color:var(--dim);font-size:14px;margin-top:5px;min-height:2.6em}
  #meta{color:var(--dim);font-size:13px;margin-top:8px}
  #next{color:var(--dim);font-size:13px;min-height:1.4em;margin-top:2px}
  #videos{margin:14px 0}
  .vwrap{display:none}
  .vwrap.on{display:block}
  iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#000}
  .vlink{color:var(--dim);font-size:12px;margin-top:6px}
  .vlink a{color:#7dd3fc}
  #controls{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:20px}
  #controls button{padding:13px 6px;font-size:14px}
  #pauseBtn{grid-column:span 4;font-size:16px;padding:15px}
  /* rate */
  #rate{display:none;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:20px}
  .stars{display:flex;gap:8px;margin:10px 0 16px}
  .star{font-size:32px;cursor:pointer;color:#3d4657;line-height:1;background:none;border:0;padding:0}
  .star.on{color:#fbbf24}
  textarea{width:100%;background:#0f1115;color:var(--txt);border:1px solid var(--line);border-radius:11px;padding:10px;font:inherit;min-height:64px}
  .hist{font-size:13px;color:var(--dim)}
  .hist b{color:var(--txt)}
  .hint{color:var(--dim);font-size:12px;margin-top:8px}
  label.tog{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--dim);cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <div id="menu">
    <h1>The Hour</h1>
    <div class="sub">One hour a day · warm-up seated to standing · sun salutations · main routine · cool-down · seated meditation</div>
    <div class="days" id="days"></div>
    <h2>Today's hour</h2>
    <div class="blocks" id="blocks"></div>
    <div class="row">
      <button class="primary" id="startBtn" style="flex:1;padding:15px;font-size:16px">Start the hour</button>
      <label class="tog"><input type="checkbox" id="voiceTog"> spoken move names</label>
    </div>
    <div class="hint" id="vstatus"></div>
    <div id="histBox"></div>
  </div>

  <div id="run">
    <div class="topline">
      <div id="blockName">—</div>
      <div id="hourClock">0:00 / 60:00</div>
    </div>
    <div id="bar"></div>
    <div id="clock">0:00</div>
    <div id="moveName">&nbsp;</div>
    <div id="cue"></div>
    <div id="meta"></div>
    <div id="next"></div>
    <div id="videos">
      <div class="vwrap" id="wrapArrive"><div id="vpArrive"></div>
        <div class="vlink"><button id="playArrive" style="display:none">▶ Tap to play</button> <span id="linkArrive"></span></div></div>
      <div class="vwrap" id="wrapSettle"><div id="vpSettle"></div>
        <div class="vlink"><button id="playSettle" style="display:none">▶ Tap to play</button> <span id="linkSettle"></span></div></div>
    </div>
    <div id="controls">
      <button id="pauseBtn">Pause</button>
      <button id="backBtn">Back</button>
      <button id="skipBtn">Skip</button>
      <button id="addBtn">+10s</button>
      <button id="stopBtn">Stop</button>
    </div>
  </div>

  <div id="rate">
    <h1 id="rateTitle">How was it?</h1>
    <div class="sub" id="rateSub"></div>
    <div class="stars" id="stars"></div>
    <textarea id="note" placeholder="What worked, what didn't — anything you want changed next week?"></textarea>
    <div class="row">
      <button class="primary" id="saveRate">Save rating</button>
      <button id="copyRates">Copy all ratings</button>
      <button id="backMenu">Back to the week</button>
    </div>
    <div class="hint" id="rateHint"></div>
  </div>
</div>

<script>
const DATA = {"pool":{"neck-tilts":{"id":"neck-tilts","name":"Neck Tilts","pattern":"mobility","position":"seated","impact":"none","level":1,"unit":"reps","default":6,"cue":"Drop the chin slowly toward the chest, then look up. Nothing forced.","from":"Universal Warmup"},"neck-side-tilts":{"id":"neck-side-tilts","name":"Neck Side Tilts","pattern":"mobility","position":"seated","impact":"none","level":1,"unit":"reps","default":6,"cue":"Tip one ear toward the shoulder, then the other. Let the shoulder stay down.","from":"Universal Warmup"},"shoulder-rolls":{"id":"shoulder-rolls","name":"Shoulder Rolls","pattern":"mobility","position":"seated","impact":"none","level":1,"unit":"reps","default":10,"cue":"Roll the shoulders back and around, big slow circles.","from":"Classic Warmup"},"arm-circles":{"id":"arm-circles","name":"Arm Circles","pattern":"mobility","position":"seated","impact":"none","level":1,"unit":"reps","default":10,"cue":"Arms out wide, circles small to large. Both directions.","from":"Classic Warmup"},"chest-expansions":{"id":"chest-expansions","name":"Chest Expansions","pattern":"mobility","position":"seated","impact":"none","level":1,"unit":"reps","default":6,"cue":"Open the arms wide and squeeze the shoulder blades together.","from":"Universal Warmup"},"spinal-twists":{"id":"spinal-twists","name":"Spinal Twists","pattern":"mobility","position":"seated","impact":"none","level":1,"unit":"reps","default":10,"cue":"Arms loose, turn from the ribcage. Hips stay planted.","from":"Classic Warmup"},"hip-rotations":{"id":"hip-rotations","name":"Hip Rotations","pattern":"mobility","position":"standing","impact":"none","level":1,"unit":"reps","default":6,"cue":"Hands on hips, circle the pelvis. Wide and unhurried.","from":"Universal Warmup"},"side-leg-raises-stand":{"id":"side-leg-raises-stand","name":"Side Leg Raises","pattern":"mobility","position":"standing","impact":"low","level":1,"unit":"reps","default":10,"cue":"Lift the leg out to the side. Hold a wall if balance is shaky.","from":"Classic Warmup"},"calf-raises":{"id":"calf-raises","name":"Calf Raises","pattern":"legs","position":"standing","impact":"low","level":1,"unit":"reps","default":15,"cue":"Rise onto the balls of the feet, pause, lower slowly.","from":"Low Impact"},"march-steps":{"id":"march-steps","name":"March Steps","pattern":"cardio","position":"standing","impact":"low","level":1,"unit":"reps","default":20,"cue":"March on the spot, drive the knee up, swing the opposite arm.","from":"Outlast"},"high-knees":{"id":"high-knees","name":"High Knees","pattern":"cardio","position":"standing","impact":"moderate","level":2,"unit":"reps","default":30,"cue":"Fast knees, tall posture, stay light on the feet.","from":"Total Core"},"step-jacks":{"id":"step-jacks","name":"Step Jacks","pattern":"cardio","position":"standing","impact":"low","level":1,"unit":"reps","default":20,"cue":"One foot steps out as the arms come up. One foot always on the floor.","from":"Classic Warmup"},"side-jacks":{"id":"side-jacks","name":"Side Jacks","pattern":"cardio","position":"standing","impact":"low","level":1,"unit":"reps","default":20,"cue":"Step side to side, one arm rising overhead each rep.","from":"Universal Warmup"},"jumping-jacks":{"id":"jumping-jacks","name":"Jumping Jacks","pattern":"cardio","position":"standing","impact":"high","level":2,"unit":"reps","default":20,"cue":"Land softly, knees a little bent, hands all the way up.","from":"Last Life"},"squats":{"id":"squats","name":"Squats","pattern":"legs","position":"standing","impact":"low","level":1,"unit":"reps","default":14,"cue":"Down until the thighs are at least parallel, weight in the heels.","from":"Bubble Butt"},"split-lunges":{"id":"split-lunges","name":"Split Lunges","pattern":"legs","position":"standing","impact":"low","level":2,"unit":"reps","default":10,"cue":"Alternate legs. Stay upright, both knees bending.","from":"Strong Start"},"cossack-squats":{"id":"cossack-squats","name":"Cossack Squats","pattern":"legs","position":"standing","impact":"low","level":3,"unit":"reps","default":10,"cue":"Slide side to side. Heel of the bent leg stays flat, chest tall.","from":"Strong Start"},"lunge-step-ups":{"id":"lunge-step-ups","name":"Lunge Step-Ups","pattern":"legs","position":"standing","impact":"low","level":2,"unit":"reps","default":10,"cue":"Start in a lunge, back knee just off the floor. Drive up through the front heel.","from":"Bubble Butt"},"push-back-kicks":{"id":"push-back-kicks","name":"Push Back Kicks","pattern":"glutes","position":"allfours","impact":"none","level":1,"unit":"reps","default":14,"cue":"Kick one leg straight back until it is level with the body. Knee comes in without touching down.","from":"Bubble Butt"},"glute-bridges":{"id":"glute-bridges","name":"Glute Bridges","pattern":"glutes","position":"supine","impact":"none","level":1,"unit":"reps","default":15,"cue":"Push the hips up, squeeze at the top, lower with control.","from":"Low Impact"},"single-leg-bridges":{"id":"single-leg-bridges","name":"Single Leg Bridges","pattern":"glutes","position":"supine","impact":"none","level":2,"unit":"reps","default":14,"cue":"One leg points at the ceiling, the other foot drives the hips up. Squeeze at the top.","from":"Bubble Butt"},"leg-extensions":{"id":"leg-extensions","name":"Leg Extensions","pattern":"glutes","position":"allfours","impact":"none","level":1,"unit":"reps","default":14,"cue":"On all fours, straighten one leg back and up. Keep the hips level.","from":"Low Impact"},"side-leg-extensions":{"id":"side-leg-extensions","name":"Side Leg Extensions","pattern":"glutes","position":"allfours","impact":"none","level":1,"unit":"reps","default":14,"cue":"Lift the bent knee out to the side. The pelvis does not roll.","from":"Low Impact"},"shoulder-taps":{"id":"shoulder-taps","name":"Shoulder Taps","pattern":"core","position":"plank","impact":"none","level":2,"unit":"reps","default":20,"cue":"Tap the opposite shoulder without letting the hips rock.","from":"Strong Start"},"plank-leg-raises":{"id":"plank-leg-raises","name":"Plank Leg Raises","pattern":"core","position":"plank","impact":"none","level":2,"unit":"reps","default":10,"cue":"Lift from the glute. Do not let the lower back arch.","from":"Strong Start"},"plank-rotations":{"id":"plank-rotations","name":"Plank Rotations","pattern":"core","position":"plank","impact":"none","level":2,"unit":"reps","default":10,"cue":"Turn as one unit and follow the reaching hand with the eyes.","from":"Arms & Back"},"climber-taps":{"id":"climber-taps","name":"Climber Taps","pattern":"core","position":"plank","impact":"low","level":2,"unit":"reps","default":10,"cue":"Bring the knee to the elbow slowly, no bouncing.","from":"Total Core"},"plank-walkouts":{"id":"plank-walkouts","name":"Plank Walk-Outs","pattern":"core","position":"plank","impact":"none","level":2,"unit":"reps","default":4,"cue":"Walk the hands out to a plank and back. Four slow ones beat twenty rushed.","from":"Total Core"},"alt-arm-leg-raises":{"id":"alt-arm-leg-raises","name":"Alternating Arm and Leg Raises","pattern":"core","position":"allfours","impact":"none","level":2,"unit":"reps","default":4,"cue":"Opposite arm and leg reach out long. Balance across the whole trunk.","from":"Total Core"},"side-plank-crunches":{"id":"side-plank-crunches","name":"Side Plank Crunches","pattern":"core","position":"floor","impact":"none","level":2,"unit":"reps","default":4,"cue":"From a side plank, bring the top elbow toward the hip.","from":"Total Core"},"dead-bugs":{"id":"dead-bugs","name":"Dead Bugs","pattern":"core","position":"supine","impact":"none","level":1,"unit":"reps","default":12,"cue":"Lower back pressed down. Opposite arm and leg extend together.","from":"Low Impact"},"flutter-kicks":{"id":"flutter-kicks","name":"Flutter Kicks","pattern":"core","position":"supine","impact":"none","level":2,"unit":"reps","default":20,"cue":"Small fast kicks, legs a little off the floor, lower back planted.","from":"Low Impact"},"knee-to-elbows":{"id":"knee-to-elbows","name":"Knee-to-Elbows","pattern":"core","position":"standing","impact":"moderate","level":2,"unit":"reps","default":20,"cue":"Drive the knee up to meet the opposite elbow.","from":"Begin Again"},"seated-leg-raises":{"id":"seated-leg-raises","name":"Seated Leg Raises","pattern":"core","position":"seated","impact":"none","level":2,"unit":"reps","default":20,"cue":"Lean back on the hands, lift one straight leg as fast as you can control.","from":"Post-Cardio Cooldown"},"raised-leg-hold":{"id":"raised-leg-hold","name":"Raised Leg Hold","pattern":"core","position":"seated","impact":"none","level":2,"unit":"reps","default":1,"cue":"Keep the leg up and still. This is where the tendons work.","from":"Post-Cardio Cooldown"},"push-ups":{"id":"push-ups","name":"Push-Ups","pattern":"push","position":"plank","impact":"low","level":2,"unit":"reps","default":20,"cue":"Body in one line, chest to the floor, elbows back not flared.","from":"The Last Stand"},"side-bicep-extensions":{"id":"side-bicep-extensions","name":"Side Bicep Extensions","pattern":"push","position":"standing","impact":"none","level":1,"unit":"reps","default":20,"cue":"Arms straight out to the sides, elbow to hand. Keep the arms parallel to the floor.","from":"Arms & Back"},"bicep-extensions":{"id":"bicep-extensions","name":"Bicep Extensions","pattern":"push","position":"standing","impact":"none","level":1,"unit":"reps","default":20,"cue":"Both arms push forward from the shoulders and pull back. Do not let the elbows droop.","from":"Arms & Back"},"step-bicep-extensions":{"id":"step-bicep-extensions","name":"Step Bicep Extensions","pattern":"push","position":"standing","impact":"low","level":1,"unit":"reps","default":20,"cue":"Keep stepping side to side while the arms push and pull.","from":"Begin Again"},"superman-stretches":{"id":"superman-stretches","name":"Superman Stretches","pattern":"pull","position":"prone","impact":"none","level":1,"unit":"reps","default":12,"cue":"Lift the arms and chest, squeeze between the shoulder blades, gaze down.","from":"Arms & Back"},"reverse-angels":{"id":"reverse-angels","name":"Reverse Angels","pattern":"pull","position":"prone","impact":"none","level":2,"unit":"reps","default":12,"cue":"Arms off the floor, sweep them from overhead down to the hips.","from":"Arms & Back"},"prone-reverse-flys":{"id":"prone-reverse-flys","name":"Prone Reverse Flys","pattern":"pull","position":"prone","impact":"none","level":1,"unit":"reps","default":12,"cue":"Chest lifted, open the arms out wide, squeeze and lower.","from":"Arms & Back"},"w-extensions":{"id":"w-extensions","name":"W-Extensions","pattern":"pull","position":"prone","impact":"none","level":1,"unit":"reps","default":12,"cue":"Arms bent into a W, lift the hands and elbows off the floor.","from":"Arms & Back"},"overhead-punches":{"id":"overhead-punches","name":"Overhead Punches","pattern":"push","position":"standing","impact":"low","level":1,"unit":"reps","default":20,"cue":"One fist straight up until the arm is long beside the ear, back to the chin, swap.","from":"Last Life"},"straight-punches":{"id":"straight-punches","name":"Straight Punches","pattern":"push","position":"standing","impact":"moderate","level":1,"unit":"reps","default":20,"cue":"One foot forward, hip turns behind every punch. Make each one complete.","from":"Last Life"},"cat-cow":{"id":"cat-cow","name":"Cat-Cow","pattern":"stretch","position":"allfours","impact":"none","level":1,"unit":"reps","default":8,"cue":"Breathe in as the back dips, out as it rounds.","from":"standard"},"childs-pose":{"id":"childs-pose","name":"Child's Pose","pattern":"stretch","position":"floor","impact":"none","level":1,"unit":"reps","default":1,"cue":"Hips back to the heels, arms long, forehead down. Breathe into the back.","from":"standard"},"seated-forward-fold":{"id":"seated-forward-fold","name":"Seated Forward Fold","pattern":"stretch","position":"seated","impact":"none","level":1,"unit":"reps","default":1,"cue":"Legs long, hinge from the hips, let the spine round. No bouncing.","from":"standard"},"quad-stretch":{"id":"quad-stretch","name":"Standing Quad Stretch","pattern":"stretch","position":"standing","impact":"none","level":1,"unit":"reps","default":2,"cue":"Pull the heel toward the glute, knees together, hips forward. Both sides.","from":"standard"},"chest-opener":{"id":"chest-opener","name":"Chest Opener","pattern":"stretch","position":"standing","impact":"none","level":1,"unit":"reps","default":1,"cue":"Hands clasped behind the back, lift the chest, breathe wide.","from":"standard"},"figure-four":{"id":"figure-four","name":"Figure-Four Glute Stretch","pattern":"stretch","position":"supine","impact":"none","level":1,"unit":"reps","default":2,"cue":"Ankle across the opposite knee, pull the legs in. Both sides.","from":"standard"},"seated-twist":{"id":"seated-twist","name":"Seated Twist","pattern":"stretch","position":"seated","impact":"none","level":1,"unit":"reps","default":2,"cue":"Sit tall, turn from the ribs, hand behind you. Both sides.","from":"standard"},"neck-stretch":{"id":"neck-stretch","name":"Neck Stretch","pattern":"stretch","position":"seated","impact":"none","level":1,"unit":"reps","default":2,"cue":"Ear toward the shoulder, let the weight of the head do the work. Both sides.","from":"standard"},"wrist-forearm":{"id":"wrist-forearm","name":"Wrist and Forearm Stretch","pattern":"stretch","position":"seated","impact":"none","level":1,"unit":"reps","default":2,"cue":"Arm out, palm up, gently draw the fingers back. Both sides.","from":"standard"},"calf-stretch":{"id":"calf-stretch","name":"Calf Stretch","pattern":"stretch","position":"standing","impact":"none","level":1,"unit":"reps","default":2,"cue":"Back leg straight, heel down, lean into a wall. Both sides.","from":"standard"}},"routines":{"version":2,"hour_seconds":3600,"note":"One hour per day. Meditation blocks take their real length from the YouTube video at runtime; the main circuit plays a fixed number of rounds; the c const POOL = DATA.pool, R = DATA.routines, HOUR = R.hour_seconds;
const SUN = R.sun_salutation, WARM = R.warmup, COOL = R.cooldown;
const SUN_ROUND = SUN.poses.reduce((a,p)=>a+p.sec,0);
const $ = id => document.getElementById(id);
const fmt = s => { s=Math.max(0,Math.ceil(s)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };
const BLOCKCOL = {meditation:"var(--med)", warmup:"var(--prep)", sun:"var(--sun)", main:"var(--work)", cooldown:"var(--cool)"};

/* ---------------- audio ---------------- */
let AC=null;
const ac = () => { if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(AC&&AC.state==="suspended")AC.resume(); return AC; };
function beep(freq,ms,vol){
  const c=ac(); if(!c) return;
  const g=c.createGain(), o=c.createOscillator();
  o.type="sine"; o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,c.currentTime);
  g.gain.exponentialRampToValueAtTime(vol||0.18,c.currentTime+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+ms/1000);
  o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime+ms/1000+0.03);
}
function double(){ beep(1046,140,0.16); setTimeout(()=>beep(1318,180,0.16),160); }
let voiceEnabled=false;
function say(t){ if(!voiceEnabled||!("speechSynthesis" in window)||!t) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.rate=1.05; speechSynthesis.speak(u);}catch(e){} }

/* ---------------- youtube ---------------- */
let ytReady=false, pArrive=null, pSettle=null, durArrive=null, durSettle=null;
window.onYouTubeIframeAPIReady = function(){
  ytReady = true;
  const day = currentDay();
  pArrive = mk("vpArrive", day.arrive.video, d => durArrive=d);
  pSettle = mk("vpSettle", day.settle.video, d => durSettle=d);
};
function mk(elId, vid, cb){
  try{
    return new YT.Player(elId,{
      videoId: vid, host:"https://www.youtube-nocookie.com",
      playerVars:{rel:0,modestbranding:1,playsinline:1},
      events:{
        onReady:e=>{ const d=e.target.getDuration(); if(d) cb(d); },
        onStateChange:e=>{ if(e.data===YT.PlayerState.CUED||e.data===YT.PlayerState.PLAYING){ const d=e.target.getDuration(); if(d) cb(d);} }
      }
    });
  }catch(e){ return null; }
}
function loadYT(){
  if(window.YT && window.YT.Player) { window.onYouTubeIframeAPIReady(); return; }
  const s=document.createElement("script"); s.src="https://www.youtube.com/iframe_api";
  s.onerror=()=>{ $("vstatus").textContent = "YouTube unavailable — meditations fall back to their nominal length and a link."; };
  document.head.appendChild(s);
}

/* Autoplay is not guaranteed: browsers block it unless the click that started the
   session counts as user activation. Play, then check, then reveal a manual button. */
function startVideo(which, day){
  const p = which==="arrive" ? pArrive : pSettle;
  const btn = which==="arrive" ? $("playArrive") : $("playSettle");
  const lnk = which==="arrive" ? $("linkArrive") : $("linkSettle");
  const meta = which==="arrive" ? day.arrive : day.settle;
  lnk.innerHTML = '<a href="https://www.youtube.com/watch?v='+meta.video+'" target="_blank" rel="noopener">open on YouTube</a>';
  btn.style.display="none";
  const token = st.i;
  if(p){ try{ p.unMute(); p.setVolume(85); p.playVideo(); }catch(e){} }
  setTimeout(()=>{
    if(st.i!==token || !p) return;
    let s=-1; try{ s=p.getPlayerState(); }catch(e){}
    if(s!==1 && s!==3){ btn.style.display="inline-block"; }
  }, 2200);
}

/* ---------------- timeline ---------------- */
function roundCost(m){ return m.moves.reduce((a,x)=>a+x.work+x.rest,0)+m.rest_between_rounds; }

function buildTimeline(day){
  const steps=[];
  const arr = (durArrive || day.arrive.nominal) + 5;
  const stl = (durSettle || day.settle.nominal) + 5;
  steps.push({block:"Arrive", kind:"meditation", label:day.arrive.title, sub:day.arrive.channel,
              cue:"Sit down, settle in. Let the recording guide you.", dur:arr, video:"arrive", round:1, rounds:1});

  WARM.moves.forEach((x,i)=>{
    const mv=POOL[x.ref];
    steps.push({block:"Warm-Up", kind:"work", label:mv.name, cue:mv.cue, dur:x.work,
                round:1, rounds:1, idx:i+1, count:WARM.moves.length, next:(WARM.moves[i+1]?POOL[WARM.moves[i+1].ref].name:"Sun Salutations")});
    if(x.rest>0) steps.push({block:"Warm-Up", kind:"rest", label:"Change over", cue:"Move on when you are ready.",
                dur:x.rest, round:1, rounds:1, idx:i+1, count:WARM.moves.length,
                next:(WARM.moves[i+1]?POOL[WARM.moves[i+1].ref].name:"Sun Salutations")});
  });

  const sr = Math.floor(SUN.budget/SUN_ROUND), sunSlack = SUN.budget - sr*SUN_ROUND;
  for(let r=1;r<=sr;r++){
    SUN.poses.forEach((p,i)=>{
      steps.push({block:"Sun Salutations", kind:"sun", label:p.name, sub:p.sanskrit, cue:p.cue, dur:p.sec,
                  round:r, rounds:sr, idx:i+1, count:SUN.poses.length,
                  next:(SUN.poses[i+1]?SUN.poses[i+1].name:"Mountain Pose (next round)")});
    });
  }
  if(sunSlack>0) steps.push({block:"Sun Salutations", kind:"sun", label:"Mountain Pose", sub:"", dur:sunSlack,
                          cue:"Stand and breathe. The main routine is next.", round:sr, rounds:sr, idx:SUN.poses.length, count:SUN.poses.length, next:"Main routine"});

  const m = day.main;

  for(let r=1;r<=m.rounds;r++){
    m.moves.forEach((x,i)=>{
      const mv=POOL[x.ref], last = (r===m.rounds && i===m.moves.length-1);
      steps.push({block:m.label, kind:"work", label:mv.name, cue:mv.cue, dur:x.work,
                  round:r, rounds:m.rounds, idx:i+1, count:m.moves.length,
                  next:(m.moves[i+1]?POOL[m.moves[i+1].ref].name:(r<m.rounds?"Round "+(r+1):"Cool-down"))});
      if(x.rest>0 && !last) steps.push({block:m.label, kind:"rest", label:"Rest", cue:"Breathe. Shake it out.",
                  dur:x.rest, round:r, rounds:m.rounds, idx:i+1, count:m.moves.length,
                  next:(m.moves[i+1]?POOL[m.moves[i+1].ref].name:"Round "+(r+1))});
    });
    if(m.rest_between_rounds>0 && r<m.rounds)
      steps.push({block:m.label, kind:"rest", label:"Round "+r+" done", cue:"Shake it out, breathe, then go again.",
                  dur:m.rest_between_rounds, round:r, rounds:m.rounds, idx:m.moves.length, count:m.moves.length,
                  next:"Round "+(r+1)+" · "+POOL[m.moves[0].ref].name});
  }

  // The cool-down takes whatever is left after everything else, so the hour is exactly
  // 60:00 no matter how long the two YouTube videos actually run.
  const usedSoFar = steps.reduce((a,x)=>a+x.dur,0);
  const coolRaw = COOL.moves.reduce((a,x)=>a+x.work+x.rest,0);
  const coolDur = Math.max(45, HOUR - usedSoFar - stl);
  const scale = coolRaw ? (coolDur/coolRaw) : 1;
  let used=0;
  COOL.moves.forEach((x,i)=>{
    const mv=POOL[x.ref];
    let d = (i===COOL.moves.length-1) ? (coolDur-used) : Math.floor((x.work+x.rest)*scale);
    used += d;
    steps.push({block:"Cool-Down", kind:"stretch", label:mv.name, cue:mv.cue, dur:d,
                round:1, rounds:1, idx:i+1, count:COOL.moves.length,
                next:(COOL.moves[i+1]?POOL[COOL.moves[i+1].ref].name:"Settle")});
  });

  steps.push({block:"Settle", kind:"meditation", label:day.settle.title, sub:day.settle.channel,
              cue:"Sit down again. Close your eyes and follow the voice.", dur:stl, video:"settle", round:1, rounds:1});
  return steps;
}
function sum(moves){ return moves.reduce((a,x)=>a+x.work+x.rest,0); }

/* ---------------- menu ---------------- */
let selId = null;
function currentDay(){ return R.days.find(d=>d.id===selId) || R.days[0]; }

function breakdown(day){
  const groups=[];
  buildTimeline(day).forEach(s=>{
    const g=groups[groups.length-1];
    if(g && g.name===s.block) g.dur+=s.dur; else groups.push({name:s.block,dur:s.dur});
  });
  return groups;
}
function colorFor(day,name){
  if(name==="Arrive"||name==="Settle") return "var(--med)";
  if(name==="Warm-Up") return "var(--prep)";
  if(name==="Sun Salutations") return "var(--sun)";
  if(name==="Cool-Down") return "var(--cool)";
  return "var(--work)";
}
function blockDesc(day,name){
  if(name==="Arrive") return day.arrive.channel+" · "+fmt(day.arrive.nominal);
  if(name==="Settle") return day.settle.channel+" · "+fmt(day.settle.nominal);
  if(name==="Warm-Up") return WARM.moves.length+" moves · seated to standing";
  if(name==="Sun Salutations") return Math.floor(SUN.budget/SUN_ROUND)+" rounds · "+SUN.poses.length+" poses";
  if(name==="Cool-Down") return COOL.moves.length+" stretches · absorbs the slack";
  return day.main.rounds+" rounds · "+day.main.moves.length+" moves · "+day.main.source;
}

function renderMenu(){
  const box=$("days"); box.innerHTML="";
  R.days.forEach(d=>{
    const b=document.createElement("button");
    b.className="day"+(d.id===selId?" on":"");
    b.innerHTML="<b>"+d.day+"</b><span>"+d.focus+"<br>"+d.main.label+"</span>";
    b.onclick=()=>{ selId=d.id; renderMenu(); renderBlocks(); };
    box.appendChild(b);
  });
  renderBlocks();
}
function renderBlocks(){
  const day=currentDay(), groups=breakdown(day), box=$("blocks");
  box.innerHTML="";
  let total=0;
  groups.forEach(g=>{
    total+=g.dur;
    const div=document.createElement("div"); div.className="blk";
    div.innerHTML="<div><b><span class='dot' style='background:"+colorFor(day,g.name)+"'></span>"+g.name+"</b><em>"
                  +blockDesc(day,g.name)+"</em></div><u>"+fmt(g.dur)+"</u>";
    box.appendChild(div);
  });
  const tot=document.createElement("div"); tot.className="blk";
  const drift = total===HOUR ? "one hour exactly" : ("off by "+(HOUR-total)+"s");
  tot.innerHTML="<div><b>Total</b><em>"+drift+"</em></div><u>"+fmt(total)+"</u>";
  box.appendChild(tot);
  $("startBtn").textContent="Start "+day.day+" · "+day.main.label;
  if(durArrive){ $("vstatus").textContent="Meditation lengths read from YouTube ("+fmt(durArrive)+" and "+fmt(durSettle)+") — the cool-down absorbed the difference."; }
}

/* ---------------- runner ---------------- */
let st={steps:[],i:0,left:0,running:false,last:0,started:0,lastBeep:null};
let hb=null;

function start(){
  ac();
  st={steps:buildTimeline(currentDay()),i:0,left:0,running:true,last:performance.now(),started:Date.now(),lastBeep:null};
  st.left=st.steps[0].dur;
  $("menu").style.display="none"; $("rate").style.display="none"; $("run").style.display="block";
  paintBar(); enter(true);
  if(hb) clearInterval(hb); hb=setInterval(tick,100);
  try{ if("wakeLock" in navigator) navigator.wakeLock.request("screen").catch(()=>{}); }catch(e){}
}
function enter(first){
  const s=st.steps[st.i];
  $("blockName").textContent=s.block+(s.rounds>1?(" · round "+s.round+"/"+s.rounds):"");
  $("moveName").textContent=s.label;
  $("cue").textContent=s.cue||"";
  $("meta").textContent = s.count>1 ? ("move "+s.idx+" of "+s.count) : "";
  $("next").textContent = s.next ? ("next: "+s.next) : "";
  // videos
  const day = currentDay();
  $("wrapArrive").classList.toggle("on", s.video==="arrive");
  $("wrapSettle").classList.toggle("on", s.video==="settle");
  if(s.video==="arrive") startVideo("arrive", day);
  if(s.video==="settle") startVideo("settle", day);
  if(s.video!=="arrive" && pArrive){ try{pArrive.pauseVideo();}catch(e){} }
  if(s.video!=="settle" && pSettle){ try{pSettle.pauseVideo();}catch(e){} }
  if(first || s.kind!=="rest"){
    if(s.kind==="meditation") double();
    else if(s.kind==="work") beep(880,170,0.18);
    else if(s.kind==="sun") beep(660,120,0.12);
    else if(s.kind==="stretch") beep(587,180,0.14);
  } else beep(494,150,0.14);
  say(s.kind==="rest" ? "" : s.label);
  paintBar();
}
function advance(){
  if(st.i>=st.steps.length-1){ finish(); return; }
  st.i++; st.left=st.steps[st.i].dur; enter(false);
}
function tick(){
  const now=performance.now(), dt=Math.min(5,(now-st.last)/1000); st.last=now;
  const s=st.steps[st.i];
  if(st.running){
    st.left-=dt;
    if(st.left<=0){ advance(); return; }
    if(st.left<=3.2 && Math.ceil(st.left)!==st.lastBeep && (s.kind==="work"||s.kind==="rest")){
      st.lastBeep=Math.ceil(st.left); beep(740,80,0.12);
    }
  }
  render();
}
function render(){
  const s=st.steps[st.i];
  $("clock").textContent=fmt(st.left);
  const done=st.steps.slice(0,st.i).reduce((a,x)=>a+x.dur,0)+ (s.dur-Math.max(0,st.left));
  $("hourClock").textContent=fmt(done)+" / "+fmt(HOUR);
  $("pauseBtn").textContent=st.running?"Pause":"Resume";
  paintCursor(done);
}
function paintBar(){
  const bar=$("bar"); bar.innerHTML="";
  const groups=[];
  st.steps.forEach(s=>{
    const g=groups[groups.length-1];
    if(g && g.name===s.block) g.dur+=s.dur; else groups.push({name:s.block,dur:s.dur,kind:s.kind});
  });
  groups.forEach(g=>{
    const el=document.createElement("i");
    el.style.width=(g.dur/HOUR*100)+"%";
    el.style.background=BLOCKCOL[g.kind]||"var(--line)";
    el.style.opacity="0.35";
    el.title=g.name;
    bar.appendChild(el);
  });
}
function paintCursor(done){
  const segs=[...document.querySelectorAll("#bar i")];
  const groups=[]; st.steps.forEach(s=>{ const g=groups[groups.length-1]; if(g&&g.name===s.block)g.dur+=s.dur; else groups.push({name:s.block,dur:s.dur}); });
  let acc=0;
  groups.forEach((g,k)=>{
    const full = (done>=acc+g.dur) ? 1 : (done<=acc ? 0 : (done-acc)/g.dur);
    if(segs[k]) segs[k].style.opacity=(0.35+0.65*full).toFixed(2);
    acc+=g.dur;
  });
}
function finish(){
  st.running=false; if(hb){clearInterval(hb);hb=null;}
  double(); setTimeout(double,400);
  try{pArrive&&pArrive.pauseVideo();}catch(e){}
  try{pSettle&&pSettle.pauseVideo();}catch(e){}
  $("run").style.display="none"; showRate();
}

/* ---------------- rating ---------------- */
const RKEY="fitness.ratings.v1";
const loadRates=()=>{ try{return JSON.parse(localStorage.getItem(RKEY))||[];}catch(e){return [];} };
const saveRates=a=>{ try{localStorage.setItem(RKEY,JSON.stringify(a));}catch(e){} };
const today=()=>new Date().toISOString().slice(0,10);
let pending={stars:0};

function showRate(){
  const day=currentDay();
  $("rate").style.display="block";
  $("rateTitle").textContent="How was "+day.day+"?";
  $("rateSub").textContent=day.focus+" · "+day.main.label;
  const box=$("stars"); box.innerHTML="";
  for(let i=1;i<=5;i++){
    const b=document.createElement("button"); b.className="star"+(pending.stars>=i?" on":""); b.textContent="★";
    b.onclick=()=>{ pending.stars=i; showRate(); };
    box.appendChild(b);
  }
  $("note").value=pending.note||"";
  const hist=loadRates().slice(-14).reverse();
  $("rateHint").innerHTML = hist.length ? ("<div class='hist' style='margin-top:14px'>"+hist.map(h=>
      "<div><b>"+h.date+"</b> "+h.day+" · "+"★".repeat(h.stars)+"☆".repeat(5-h.stars)+(h.note?(" — "+h.note):"")+"</div>").join("")+"</div>") : "";
}
$("saveRate").onclick=()=>{
  if(!pending.stars){ $("rateHint").textContent="Pick a star rating first."; return; }
  const a=loadRates();
  a.push({date:today(),day:currentDay().day,id:selId,stars:pending.stars,note:$("note").value.trim()});
  saveRates(a);
  $("rateHint").textContent="Saved on this device. Use “Copy all ratings” and paste them to Hermes to retune the week.";
  pending={stars:0};
};
$("copyRates").onclick=async()=>{
  const txt=JSON.stringify(loadRates());
  try{ await navigator.clipboard.writeText(txt); $("rateHint").textContent="Ratings copied — paste them into the chat."; }
  catch(e){ $("rateHint").textContent=txt; }
};
$("backMenu").onclick=()=>{ $("rate").style.display="none"; $("menu").style.display="block"; renderBlocks(); };

/* ---------------- controls ---------------- */
$("startBtn").onclick=start;
$("pauseBtn").onclick=()=>{ st.running=!st.running; st.last=performance.now(); };
$("skipBtn").onclick=()=>{ st.left=0.001; };
$("backBtn").onclick=()=>{ if(st.i>0){ st.i--; st.left=st.steps[st.i].dur; st.last=performance.now(); enter(true); } };
$("addBtn").onclick=()=>{ st.left+=10; };
$("stopBtn").onclick=()=>{ st.running=false; if(hb){clearInterval(hb);hb=null;}
  try{pArrive&&pArrive.pauseVideo();}catch(e){} try{pSettle&&pSettle.pauseVideo();}catch(e){}
  $("run").style.display="none"; $("menu").style.display="block"; };
$("voiceTog").onchange=e=>{ voiceEnabled=e.target.checked; if(voiceEnabled) say("Voice on"); };
$("playArrive").onclick=()=>{ try{pArrive.unMute(); pArrive.setVolume(85); pArrive.playVideo();}catch(e){} $("playArrive").style.display="none"; };
$("playSettle").onclick=()=>{ try{pSettle.unMute(); pSettle.setVolume(85); pSettle.playVideo();}catch(e){} $("playSettle").style.display="none"; };

selId = R.days[new Date().getDay()===0?6:new Date().getDay()-1].id;
renderMenu();
loadYT();
</script>
